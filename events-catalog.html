  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- Top Header Bar -->
  <header class="portal-topbar">
    <div class="portal-topbar-left">
      <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Open Sidebar Navigation">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <a href="index.html" class="brand-logo" aria-label="TourismHub Home" style="text-decoration: none;">
        <svg class="brand-icon-svg" viewBox="0 0 44 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <polygon points="12,4 23,32 1,32" fill="#10B981" />
          <polygon points="28,10 41,32 15,32" fill="#0284C7" />
        </svg>
        <span>TourismHub</span>
      </a>
    </div>

    <div class="portal-topbar-right">
      <a href="admin.html" class="nav-admin-dashboard-btn admin-only-feature" style="display: none;" title="Admin Operator Dashboard">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="3" width="7" height="9"></rect>
          <rect x="14" y="3" width="7" height="5"></rect>
          <rect x="14" y="12" width="7" height="9"></rect>
          <rect x="3" y="16" width="7" height="5"></rect>
        </svg>
      </a>

      <button class="portal-notif-btn topbar-theme-toggle-btn" id="globalDarkModeBtn" onclick="toggleGlobalTheme()" aria-label="Toggle Theme" title="Toggle Theme">
        <svg class="theme-btn-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="theme-btn-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>

      <a href="notifications.html" class="portal-notif-btn" aria-label="Notifications" title="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

        </svg>
        <span class="sidebar-item-badge-dot" style="position: absolute; top: 8px; right: 8px;"></span>

        <div class="portal-user-profile" id="userProfileBtn" title="Account / Options" style="display: none; cursor: pointer;">

            alt="Tourist Profile" class="portal-avatar-img" style="background: var(--bg-subtle);">
        </div>
      </div>

      <a href="login.html" class="auth-signin-link" id="navSignInLink" style="display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.84rem; font-weight: 600; color: #0284c7; text-decoration: none; padding: 0.42rem 0.85rem; border: 1.5px solid #0284c7; border-radius: 9999px; transition: all 0.2s;" title="Tourist Portal Sign In & Registration">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        <span>Sign In</span>
      </a>
    </div>
  </header>

  <!-- Main Portal Content -->
  <main class="portal-main-wrapper">

    <!-- Page Header -->
    <div class="portal-section-header">
      <div class="portal-title-group">
        <div class="portal-title-icon-box">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </div>
        <div>
          <h1 class="portal-page-heading">Attractions & Events
</h1>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
        <a href="events.html" class="btn-outline-sm" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          <span>Calendar View</span>
        </a>
      </div>
    </div>

    <!-- Catalog Mode Switcher Tabs -->
    <div class="catalog-mode-tabs" role="tablist" aria-label="Browse Attractions or Events">
      <a href="attractions.html" class="catalog-mode-tab" role="tab" aria-selected="false">Attractions</a>
      <a href="events-catalog.html" class="catalog-mode-tab active" role="tab" aria-selected="true">Events</a>
    </div>

    <!-- Search Bar with Live Dropdown -->
    <div class="attractions-simple-search-bar" style="margin-bottom: 1rem;">
      <div class="portal-hero-search" style="position: relative; max-width: 100%; background: var(--bg-card); border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="eventsSearchInput" placeholder="Search events by title, venue, or location..." autocomplete="off" style="color: var(--text-main);">
        <button class="portal-hero-search-btn" id="eventsSearchBtn" aria-label="Search events">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <!-- Filter & Sort Bar -->
    <div class="portal-filter-bar" style="margin-bottom: 1.5rem;">
      <div class="portal-filter-tabs" id="eventsFilterTabs">
        <button class="portal-filter-tab active" data-event-filter="all">All Events</button>
        <button class="portal-filter-tab" data-event-filter="upcoming">Upcoming</button>
        <button class="portal-filter-tab" data-event-filter="free">Free Entry</button>
      </div>

      <div class="portal-dropdown-group">
        <select class="portal-select" id="eventsSortSelect" aria-label="Sort events">
          <option value="soonest">Soonest Date</option>
          <option value="capacity">Most Available Slots</option>
          <option value="newest">Newest First</option>
        </select>
      </div>
    </div>

    <!-- Events Catalog Grid -->
    <div id="eventsCatalogCount" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 1rem;"></div>
    <div class="events-banner-grid" id="eventsCatalogGrid">
      <!-- Populated dynamically via js/events-catalog.js -->
    </div>

  </main>

  <!-- Supabase CDN Client & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>

  <!-- Shared State Store & Scripts -->
  <script src="js/store.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/profile-dropdown.js"></script>
  <script src="js/portal-sync.js"></script>
  <script src="js/events-catalog.js"></script>
</body>

</html>
